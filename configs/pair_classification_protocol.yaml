# Pair-classification protocol.
#
# A separate experiment track from the top-k candidate recommendation
# experiments (run_ir_baselines.py, run_neural_baselines.py,
# run_llm_baselines.py, run_proposed_framework.py,
# configs/final_framework_config.yaml). Pair-classification outputs use
# the separate paths listed under output_layout.

status: frozen

scope: >
  A binary-classification view of each method's link judgment, decoupled
  from the top-k recommendation window, with reporting stratified by each
  requirement's real gold-link density. Existing P@10/R@10/MRR
  recommendation metrics are unaffected and continue to be reported from
  the existing pipeline exactly as before.

datasets:
  active: [eTour, eANCI, iTrust, LibEST]
  requirement_scope: evaluation_requirements
  note: >
    Same evaluation_requirements scope as the existing recommendation
    experiments (TraceDataset.evaluation_requirements, i.e. Is_No_Code
    requirements excluded).

pair_sampling:
  positive_definition: every (requirement, code_file) pair present in the
    dataset's real gold trace links, for every evaluation requirement.
  negative_definition: >
    For each positive pair (r, c_pos), sample exactly one negative pair
    (r, c_neg) with c_neg drawn from the code files NOT linked to r,
    forming a 1:1 positive:negative ratio at the pair level.
  sampling_algorithm: >
    For each dataset, requirements are processed in sorted Req_ID order;
    within each requirement, positives are processed in sorted Code_File
    order. A single random.Random(seed) instance is seeded once per
    dataset and consumed in this fixed order, so the same manifest is
    regenerated byte-for-byte from the same code and seed. Negatives are
    drawn without replacement per requirement as long as enough
    non-linked candidates exist; otherwise negative sampling falls back
    to with-replacement for the excess pairs only, and those rows are
    flagged (SampledWithReplacement=True).
  seed: 42
  manifest_output: configs/pair_classification_manifests/{dataset}.csv
  manifest_frozen: >
    Manifests are generated once by
    scripts/generate_pair_classification_manifest.py and committed as a
    frozen artifact. The runner/evaluator reads pairs from the manifest
    at run time; it does not regenerate or resample pairs.
  split_column: >
    Each manifest row carries Split (validation/heldout), assigned once
    per requirement from configs/validation_split.json's
    validation_requirement_ids for that dataset. A requirement never has
    pairs on both sides.

density_grouping:
  basis: number of real gold links for the pair's requirement (measured
    from ground_truth_by_requirement, independent of the 1:1 sampling).
  groups:
    - name: "1-2"
      min_links: 1
      max_links: 2
    - name: "3-10"
      min_links: 3
      max_links: 10
    - name: ">10"
      min_links: 11
      max_links: null

binary_classification_metric:
  definition: >
    Precision/Recall/F1 computed directly from each method's own
    prediction on each manifest pair (LLM Yes/No or IR/neural score
    thresholded), independent of any top-k recommendation window.
  threshold_selection_rule: >
    For methods with a continuous score, one threshold per method is
    calibrated by maximizing F1 on the validation_requirement_ids listed
    per dataset in configs/validation_split.json, pooled across all 4
    active datasets (a single global threshold per method; no
    per-dataset tuning). The threshold is frozen in
    audit/pair_classification_validation/ before any full-dataset run.
  threshold_search_space: >
    Every unique score observed among the pooled validation pairs is
    tried as a candidate cutoff (plus one point below the minimum), an
    exact exhaustive search over all realizable partitions.

full_dataset_reporting:
  eANCI_caveat: >
    eANCI's frozen pair-classification manifest contains 38 requirements:
    5 validation requirements and 33 held-out requirements. Full-manifest
    metrics include the validation requirements used to calibrate the
    threshold and are descriptive only. Held-out metrics are computed
    separately on the 33 held-out requirements.

constraints:
  - Thresholds are calibrated only on the pooled validation requirements
    from configs/validation_split.json, and frozen before any
    full-dataset run.
  - Generalization is evaluated on held-out requirements only;
    full-manifest metrics include validation requirements.

output_layout:
  manifests: configs/pair_classification_manifests/{dataset}.csv
  predictions: results/pair_classification/{dataset}/{method}/predictions.csv
  metrics: results/pair_classification/{dataset}/{method}/metrics.csv
  density_group_metrics: results/pair_classification/{dataset}/{method}/density_group_metrics.csv
  validation_calibration_and_audit: audit/pair_classification_validation/

methods_in_scope:
  free_to_score_via_existing_raw_scores:
    methods: [TFIDF, BM25, LSI, Sentence-BERT, CodeBERT]
    note: >
      The baseline scripts generate results/{ir,neural}_baselines/{dataset}/
      *_raw_scores.csv over the full requirement x code_file cartesian
      product. Manifest pairs are then scored by direct lookup.
  requires_new_live_api_calls:
    methods:
      - Direct Prompting
      - Generic RAG-LLM
      - "Proposed-PairClassifier (BAN+SRCV, DCAR-bypassed)"
    note: >
      Manifest negatives are sampled from the full code corpus, not just
      a retrieved candidate pool. Scoring requires LLM calls unless
      matching responses are already cached. The pair-classification
      variants bypass DCAR candidate selection and score every supplied
      pair; end-to-end retrieval is evaluated separately.
